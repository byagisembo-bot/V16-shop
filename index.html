<!DOCTYPE html>
<html lang="rw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V16 SHOP V4 CART</title>
<style>
:root{--b:#0a0a0a;--bd:#e5e7eb;--r:#ef4444}
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#f5f5f7;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;background:#fff;min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.08);display:flex;flex-direction:column}
.header{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:20}
.logo{font-weight:900;font-size:19px}.badge{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800}
.b-admin{background:#000;color:#fff}.b-staff{background:#3b82f6;color:#fff}.b-client{background:#e5e7eb}
.logout{color:#ef4444;font-weight:800;font-size:12px;cursor:pointer}
.cart-btn{background:#000;color:#fff;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800;cursor:pointer;position:relative}
.cart-count{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center}
.login{padding:36px 22px;flex:1;display:flex;flex-direction:column;justify-content:center}
.login h1{font-size:42px;font-weight:950;text-align:center;margin-bottom:6px}
.login .sub{text-align:center;color:#888;font-size:13px;margin-bottom:28px}
input,select,textarea{width:100%;padding:14px 15px;border:2px solid var(--bd);border-radius:14px;font-size:14px;margin-bottom:10px;outline:none}
.btn{width:100%;padding:14px;background:#0a0a0a;color:#fff;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer}
.btn-sec{background:#fff;color:#000;border:2px solid #000}.btn-red{background:#ef4444}.btn-green{background:#10b981}
.tabs{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--bd);overflow-x:auto;background:#fafafa;position:sticky;top:57px;z-index:10}
.tab{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid var(--bd);background:#fff}
.tab.active{background:#000;color:#fff}
.content{padding:14px;flex:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#f9fafb;border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;position:relative}
.card img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:#f3f4f6}
.card h3{font-size:14px}.card p{font-size:12px;color:#6b7280;line-height:1.4}
.del{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;border:none;border-radius:8px;padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer}
.edit{position:absolute;top:10px;right:56px;background:#000;color:#fff;border:none;border-radius:8px;padding:5px 9px;font-size:10px;cursor:pointer}
.low{border-left:4px solid #ef4444}.hidden{display:none}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:11px;color:#9ca3af;text-align:center;margin:12px 0;line-height:1.5}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.cart-box{background:#000;color:#fff;border-radius:16px;padding:14px;margin-bottom:14px;position:sticky;top:100px;z-index:5}
.cart-item{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #333}
</style></head><body><div class="app">
<div class="header hidden" id="header"><div class="logo" id="shopNameLogo">V16 SHOP</div><div style="display:flex;gap:8px;align-items:center"><div class="cart-btn hidden" id="cartBtn" onclick="goTab('cart')">🛒 Panier <span class="cart-count" id="cartCount">0</span></div><span id="roleBadge" class="badge"></span><span class="logout" onclick="logout()">Sohoka</span></div></div>
<div id="loginPage" class="login"><h1>V16 SHOP</h1><p class="sub">V4 CART - Guteranya Order</p>
<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">Injira</button>
<div class="small">Admin: admin / 1234<br>Staff: staff / 1234<br>Client: 211 / 211<br><br>Staff: Yemerwe guteranya<br>Inkweto + Urusunda + Amashu = Order 1</div></div>
<div id="mainApp" class="hidden" style="flex:1;display:flex;flex-direction:column"><div class="tabs" id="tabs"></div><div class="content" id="content"></div></div>
</div>
<script>
const K_USERS='v16_v4_users', K_PRODS='v16_v4_prods', K_ORDERS='v16_v4_orders', K_CFG='v16_v4_cfg', K_SESS='v16_v4_sess';
let me=null, curTab='dashboard', CART=[];
function defUsers(){return [{u:'admin',p:'1234',role:'admin',name:'Admin Mukuru'},{u:'staff',p:'1234',role:'staff',name:'Staff'},{u:'211',p:'211',role:'client',name:'Client 211'}]}
function getUsers(){return JSON.parse(localStorage.getItem(K_USERS)||JSON.stringify(defUsers()))}
function saveUsers(a){localStorage.setItem(K_USERS,JSON.stringify(a))}
function getProds(){return JSON.parse(localStorage.getItem(K_PRODS)||'[]')}
function saveProds(a){localStorage.setItem(K_PRODS,JSON.stringify(a))}
function getOrders(){return JSON.parse(localStorage.getItem(K_ORDERS)||'[]')}
function saveOrders(a){localStorage.setItem(K_ORDERS,JSON.stringify(a))}
function getCfg(){return JSON.parse(localStorage.getItem(K_CFG)||'{"shopName":"V16 SHOP","wa":"250788000000"}')}
function saveCfg(c){localStorage.setItem(K_CFG,JSON.stringify(c))}
function doLogin(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value.trim();const f=getUsers().find(x=>x.u===u&&x.p===p);if(!f){alert('Nabi!');return}me=f;localStorage.setItem(K_SESS,JSON.stringify(me));CART=[];render();}
function logout(){localStorage.removeItem(K_SESS);me=null;CART=[];document.getElementById('loginPage').classList.remove('hidden');document.getElementById('header').classList.add('hidden');document.getElementById('mainApp').classList.add('hidden');}
function render(){const cfg=getCfg();document.getElementById('shopNameLogo').textContent=cfg.shopName;document.getElementById('loginPage').classList.add('hidden');document.getElementById('header').classList.remove('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('roleBadge').textContent=me.role.toUpperCase();document.getElementById('roleBadge').className='badge b-'+me.role;if(me.role!=='admin'){document.getElementById('cartBtn').classList.remove('hidden')}else{document.getElementById('cartBtn').classList.add('hidden')}let tabs=[];if(me.role==='admin'){tabs=[{id:'dashboard',l:'📊 Dashboard'},{id:'products',l:'📦 Stock'},{id:'orders',l:'🧾 Orders'},{id:'users',l:'👥 Users'},{id:'add',l:'➕ Ongeramo'},{id:'settings',l:'⚙️ Settings'}];curTab='dashboard'}else if(me.role==='staff'){tabs=[{id:'shop',l:'🛍️ Shop'},{id:'cart',l:'🛒 Panier'},{id:'orders',l:'🧾 Orders'}];curTab='shop'}else{tabs=[{id:'shop',l:'🛍️ Shop'},{id:'cart',l:'🛒 Panier'},{id:'myorders',l:'📦 My Orders'}];curTab='shop'}document.getElementById('tabs').innerHTML=tabs.map(t=>`<div class="tab ${curTab===t.id?'active':''}" onclick="goTab('${t.id}')">${t.l}</div>`).join('');updateCartCount();goTab(curTab);}
function goTab(id){curTab=id;document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));const el=document.querySelector(`.tab[onclick="goTab('${id}')"]`);if(el)el.classList.add('active');const c=document.getElementById('content');if(id==='dashboard')drawDash(c);else if(id==='products')drawProds(c);else if(id==='orders')drawOrders(c);else if(id==='users')drawUsers(c);else if(id==='add')drawAdd(c);else if(id==='settings')drawSettings(c);else if(id==='shop')drawShop(c);else if(id==='cart')drawCart(c);else if(id==='myorders')drawMyOrders(c);}
function updateCartCount(){document.getElementById('cartCount').textContent=CART.length;document.getElementById('cartBtn').style.display=CART.length>0||me.role!=='admin'?'flex':'none'}
function drawDash(c){const prods=getProds(),orders=getOrders();const total=prods.reduce((s,p)=>s+Number(p.sell||0)*Number(p.qty||0),0);const sold=orders.reduce((s,o)=>s+Number(o.total||0),0);c.innerHTML=`<div class="stat-grid"><div class="stat"><span>Stock</span><b>${prods.length}</b></div><div class="stat"><span>Orders</span><b>${orders.length}</b></div><div class="stat"><span>Stock Value</span><b>${total.toLocaleString()}</b></div><div class="stat"><span>Byacurujwe</span><b>${sold.toLocaleString()} RWF</b></div></div><div class="card"><h3>✅ V4 CART</h3><p>Staff yemerewe guteranya:<br>Inkweto + Urusunda + Amashu = Order imwe<br><br>Staff: Gucuruza + Ingano + Guteranya<br>NTIYEMEREWE: Gusiba</p></div>`}
function drawProds(c){const prods=getProds();if(!prods.length){c.innerHTML='<p class="small">Nta gicuruzwa</p>';return}c.innerHTML=prods.map(p=>`<div class="card ${Number(p.qty)<=3?'low':''}">${p.img?`<img src="${p.img}">`:''}<h3>${p.name}</h3><p>Igurisha: <b>${p.sell} RWF</b><br>Stock: <b>${p.qty}</b></p>${me.role==='admin'?`<button class="edit" onclick="editProd(${p.id})">Edit</button><button class="del" onclick="delProd(${p.id})">Siba</button>`:''}</div>`).join('')}
function drawAdd(c,edit=null){c.innerHTML=`<div class="card" style="border:2px solid #000"><h3>${edit?'✏️ Hindura':'➕ Ongeramo'}</h3><br><input id="pn" placeholder="Izina *" value="${edit?edit.name:''}"><div class="row2"><input id="pb" type="number" placeholder="Igura" value="${edit?edit.buy:''}"><input id="ps" type="number" placeholder="Igurisha *" value="${edit?edit.sell:''}"></div><div class="row2"><input id="pq" type="number" placeholder="Stock *" value="${edit?edit.qty:''}"><input id="pi2" placeholder="Image URL" value="${edit?edit.img:''}"></div><textarea id="pd" placeholder="Ibisobanuro">${edit?edit.desc||'':''}</textarea><button class="btn" onclick="${edit?`updProd(${edit.id})`:'newProd()'}">Bika</button></div>`}
function newProd(){const name=document.getElementById('pn').value.trim(),buy=document.getElementById('pb').value.trim(),sell=document.getElementById('ps').value.trim(),qty=document.getElementById('pq').value.trim(),img=document.getElementById('pi2').value.trim(),desc=document.getElementById('pd').value.trim();if(!name||!sell||!qty)return;const a=getProds();a.unshift({id:Date.now(),name,buy,sell,qty,img,desc});saveProds(a);alert('Byabitswe!');goTab('products')}
function delProd(id){if(!confirm('Gusiba?'))return;saveProds(getProds().filter(p=>p.id!==id));drawProds(document.getElementById('content'))}
function editProd(id){const p=getProds().find(x=>x.id===id);goTab('add');setTimeout(()=>drawAdd(document.getElementById('content'),p),60)}
function updProd(id){const name=document.getElementById('pn').value.trim(),buy=document.getElementById('pb').value.trim(),sell=document.getElementById('ps').value.trim(),qty=document.getElementById('pq').value.trim(),img=document.getElementById('pi2').value.trim(),desc=document.getElementById('pd').value.trim();let a=getProds(),i=a.findIndex(x=>x.id===id);a[i]={...a[i],name,buy,sell,qty,img,desc};saveProds(a);goTab('products')}
function drawOrders(c){
  const orders=getOrders();
  if(!orders.length){c.innerHTML='<p class="small">Nta order</p>';return}
  c.innerHTML=orders.map(o=>`<div class="card"><h3>🧾 Order #${o.id.toString().slice(-4)} - ${o.total?.toLocaleString()||o.price} RWF</h3>
  <p>${o.items?o.items.map(it=>`• ${it.name} - ${it.qty} x ${it.price} = ${it.total} RWF`).join('<br>'):`• ${o.product} - ${o.qty||1} x ${o.price} = ${o.total||o.price} RWF`}<br><br>Yacurujwe na: <b>${o.by}</b><br>Status: <b>${o.status}</b><br>${o.date}</p>
  <div style="display:flex;gap:6px;margin-top:8px">
  ${me.role==='admin'?`<button style="flex:1;padding:8px;border-radius:10px;border:none;background:#000;color:#fff;font-weight:800" onclick="updOrder(${o.id},'Approved')">Emeza</button><button style="flex:1;padding:8px;border-radius:10px;border:none;background:#e5e7eb;font-weight:800" onclick="updOrder(${o.id},'Delivered')">Delivered</button><button style="flex:1;padding:8px;border-radius:10px;border:none;background:#fee2e2;color:#b91c1c;font-weight:800" onclick="delOrder(${o.id})">Siba</button>`:
  me.role==='staff'?`<button style="flex:1;padding:8px;border-radius:10px;border:none;background:#000;color:#fff" onclick="updOrder(${o.id},'Approved')">Emeza</button><button style="flex:1;padding:8px;border-radius:10px;border:none;background:#e5e7eb" onclick="updOrder(${o.id},'Delivered')">Delivered</button><span style="flex:1;font-size:10px;text-align:center;padding:8px;background:#f3f4f6;border-radius:10px">NTUSHOBORA GUSIBA</span>`:`<span style="font-size:11px;color:#888">Admin niwe usiba</span>`}
  </div></div>`).join('')
}
function drawMyOrders(c){const orders=getOrders().filter(o=>o.by===me.u);if(!orders.length){c.innerHTML='<p class="small">Nta order</p>';return}c.innerHTML=orders.map(o=>`<div class="card"><h3>Order - ${o.total?.toLocaleString()} RWF</h3><p>${o.items?o.items.map(it=>`${it.name} x${it.qty}`).join(', '):o.product}<br>${o.status}<br>${o.date}</p></div>`).join('')}
function updOrder(id,s){let a=getOrders(),i=a.findIndex(o=>o.id===id);if(i>-1){a[i].status=s;saveOrders(a);drawOrders(document.getElementById('content'))}}
function delOrder(id){if(me.role!=='admin'){alert('⛔ Staff ntishobora gusiba!');return}if(!confirm('Gusiba?'))return;saveOrders(getOrders().filter(o=>o.id!==id));drawOrders(document.getElementById('content'))}
function drawUsers(c){const users=getUsers();c.innerHTML=users.map(u=>`<div class="card"><h3>${u.name} - ${u.u}</h3><p>Role: <b>${u.role}</b> | Pass: ${u.p}</p>${u.u!=='admin'?`<button class="del" onclick="remUser('${u.u}')">Siba</button><button class="edit" onclick="editUserPass('${u.u}')">Password</button>`:''}</div>`).join('')+`<div class="card" style="margin-top:14px;border:2px solid #000"><h3>➕ User</h3><input id="uu" placeholder="Username"><input id="up" placeholder="Password"><select id="ur"><option value="client">Client</option><option value="staff">Staff - Guteranya</option><option value="admin">Admin</option></select><button class="btn" onclick="addUser()">Bika</button></div>`}
function addUser(){const u=document.getElementById('uu').value.trim(),p=document.getElementById('up').value.trim(),r=document.getElementById('ur').value;let a=getUsers();a.push({u,p,role:r,name:u});saveUsers(a);drawUsers(document.getElementById('content'))}
function remUser(u){if(u==='admin')return;saveUsers(getUsers().filter(x=>x.u!==u));drawUsers(document.getElementById('content'))}
function editUserPass(u){const np=prompt('Password nshya ya '+u+':');if(!np)return;let a=getUsers(),i=a.findIndex(x=>x.u===u);a[i].p=np;saveUsers(a);drawUsers(document.getElementById('content'))}
function drawSettings(c){const cfg=getCfg(),admin=getUsers().find(x=>x.u==='admin');c.innerHTML=`<div class="card" style="border:2px solid #000"><h3>🔐 Password ya Admin</h3><p>Ya kera: <b>${admin.p}</b></p><input id="oldp" type="password" placeholder="Ya kera"><input id="newp" type="password" placeholder="Nshya"><input id="newp2" type="password" placeholder="Emeza"><button class="btn" onclick="changeAdminPass()">Hindura</button></div><div class="card"><h3>🏪 Izina</h3><input id="shopNameIn" value="${cfg.shopName}"><button class="btn btn-sec" onclick="saveShopName()">Bika</button></div>`}
function changeAdminPass(){const oldp=document.getElementById('oldp').value.trim(),np=document.getElementById('newp').value.trim(),np2=document.getElementById('newp2').value.trim();const admin=getUsers().find(x=>x.u==='admin');if(oldp!==admin.p){alert('Nabi!');return}if(np!==np2){alert('Ntizihura');return}let users=getUsers(),i=users.findIndex(x=>x.u==='admin');users[i].p=np;saveUsers(users);alert('Yahindutse: '+np)}
function saveShopName(){let cfg=getCfg();cfg.shopName=document.getElementById('shopNameIn').value.trim();saveCfg(cfg);document.getElementById('shopNameLogo').textContent=cfg.shopName;alert('Byabitswe')}
function drawShop(c){
  const prods=getProds();
  if(!prods.length){c.innerHTML='<p class="small">Nta gicuruzwa</p>';return}
  let html='';
  if(CART.length>0){
    const cartTotal=CART.reduce((s,it)=>s+it.total,0);
    html+=`<div class="cart-box"><b>🛒 Panier (${CART.length}) - ${cartTotal.toLocaleString()} RWF</b><div style="margin-top:8px">${CART.map((it,i)=>`<div class="cart-item"><span>${it.name} x${it.qty}</span><span>${it.total.toLocaleString()} RWF <span onclick="remFromCart(${i})" style="color:#ef4444;margin-left:8px;cursor:pointer">✕</span></span></div>`).join('')}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-green" style="flex:1" onclick="checkoutCart()">✅ Emeza Order - ${cartTotal.toLocaleString()} RWF</button><button class="btn btn-red" style="flex:1" onclick="clearCart()">Siba Panier</button></div></div></div>`;
  }
  html+=`<div class="shop-grid">`+prods.map(p=>`<div class="card"><img src="${p.img||'https://via.placeholder.com/150'}" onerror="this.style.display='none'"><h3>${p.name}</h3><p>Stock: <b>${p.qty}</b><br><b>${p.sell} RWF</b></p><button class="btn" style="margin-top:8px;padding:10px;font-size:12px" onclick="addToCart(${p.id})">➕ Ongera muri Panier</button></div>`).join('')+`</div><div class="small">Staff: Kanda ➕ ku bintu byinshi (Inkweto, Urusunda, Amashu) → Biterana muri Panier → Emeza Order imwe!</div>`;
  c.innerHTML=html;
}
function drawCart(c){
  if(CART.length===0){c.innerHTML=`<div class="card"><h3>🛒 Panier irimo ubusa</h3><p>Jya muri Shop, kanda ➕ Ongera muri Panier ku bintu byinshi, bizaterana hano.</p></div><button class="btn btn-sec" onclick="goTab('shop')">← Jya muri Shop</button>`;return}
  const total=CART.reduce((s,it)=>s+it.total,0);
  c.innerHTML=`<div class="cart-box" style="background:#fff;color:#000;border:2px solid #000"><h3 style="color:#000">🛒 Panier - Order Imwe</h3><div style="margin-top:10px">${CART.map((it,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px"><span><b>${it.name}</b><br>${it.qty} x ${it.price} RWF</span><span style="text-align:right"><b>${it.total.toLocaleString()} RWF</b><br><span onclick="remFromCart(${i})" style="color:#ef4444;font-size:11px;cursor:pointer">Siba</span></span></div>`).join('')}<div style="display:flex;justify-content:space-between;padding:12px 0;font-weight:900;font-size:16px;border-top:2px solid #000;margin-top:10px"><span>Total:</span><span>${total.toLocaleString()} RWF</span></div></div><button class="btn" style="margin-top:12px" onclick="checkoutCart()">✅ Emeza Order - ${CART.length} ibintu, ${total.toLocaleString()} RWF</button><button class="btn btn-red" style="margin-top:8px" onclick="clearCart()">🗑️ Siba Panier</button></div><div class="small">Order imwe irimo: ${CART.map(it=>it.name+' x'+it.qty).join(', ')}</div>`;
}
function addToCart(id){
  const p=getProds().find(x=>x.id===id);
  if(!p)return;
  if(me.role==='admin'){alert('Admin ureba gusa.');return}
  let qtyStr=prompt(`➕ Ongera muri Panier:\n${p.name}\nIgurisha: ${p.sell} RWF\nStock: ${p.qty}\n\nAndika INGANO:`, "1");
  if(qtyStr===null)return;
  let qty=parseInt(qtyStr);
  if(isNaN(qty)||qty<=0){alert('Nabi!');return}
  if(qty>Number(p.qty)){alert(`Stock ntihagije! Ihari: ${p.qty}`);return}
  const existing=CART.findIndex(it=>it.id===id);
  if(existing>-1){
    CART[existing].qty+=qty;
    CART[existing].total=CART[existing].qty*CART[existing].price;
  }else{
    CART.push({id:p.id,name:p.name,price:Number(p.sell),qty:qty,total:Number(p.sell)*qty});
  }
  updateCartCount();
  alert(`✅ ${p.name} x${qty} byongewe muri Panier!\nPanier: ${CART.length} ibintu, Total: ${CART.reduce((s,it)=>s+it.total,0).toLocaleString()} RWF\n\nKomeza kongeramo ibindi (Inkweto, Urusunda, Amashu) cyangwa kanda 🛒 Panier → Emeza Order`);
  drawShop(document.getElementById('content'));
}
function remFromCart(i){CART.splice(i,1);updateCartCount();if(curTab==='cart')drawCart(document.getElementById('content'));else drawShop(document.getElementById('content'))}
function clearCart(){if(!confirm('Siba Panier yose?'))return;CART=[];updateCartCount();drawCart(document.getElementById('content'))}
function checkoutCart(){
  if(CART.length===0){alert('Panier irimo ubusa');return}
  const total=CART.reduce((s,it)=>s+it.total,0);
  if(!confirm(`Emeza Order?\n${CART.length} ibintu:\n${CART.map(it=>`• ${it.name} x${it.qty} = ${it.total} RWF`).join('\n')}\n\nTOTAL: ${total.toLocaleString()} RWF\nYacurujwe na: ${me.u}`))return;
  let prods=getProds();
  for(let it of CART){
    let idx=prods.findIndex(p=>p.id===it.id);
    if(idx>-1){
      if(Number(prods[idx].qty)<it.qty){alert(`Stock ntihagije kuri ${prods[idx].name}. Ihari: ${prods[idx].qty}`);return}
    }
  }
  for(let it of CART){
    let idx=prods.findIndex(p=>p.id===it.id);
    if(idx>-1) prods[idx].qty=Number(prods[idx].qty)-it.qty;
  }
  saveProds(prods);
  const orders=getOrders();
  orders.unshift({id:Date.now(),items:[...CART],total:total,by:me.u,status:'Pending',date:new Date().toLocaleString()});
  saveOrders(orders);
  const cfg=getCfg();
