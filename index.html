<!DOCTYPE html>
<html lang="rw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V16 SHOP V3.2 FINAL</title>
<style>
:root{--b:#0a0a0a;--bd:#e5e7eb;--r:#ef4444;--g:#10b981}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0}
body{background:#f5f5f7;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;background:#fff;min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.08);display:flex;flex-direction:column}
.header{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:20}
.logo{font-weight:900;font-size:19px}.badge{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800}
.b-admin{background:#000;color:#fff}.b-staff{background:#3b82f6;color:#fff}.b-client{background:#e5e7eb}
.logout{color:#ef4444;font-weight:800;font-size:12px;cursor:pointer}
.login{padding:36px 22px;flex:1;display:flex;flex-direction:column;justify-content:center}
.login h1{font-size:42px;font-weight:950;text-align:center;margin-bottom:6px}
.login .sub{text-align:center;color:#888;font-size:13px;margin-bottom:28px}
input,select,textarea{width:100%;padding:14px 15px;border:2px solid var(--bd);border-radius:14px;font-size:14px;margin-bottom:10px;outline:none}
input:focus{border-color:#000}
.btn{width:100%;padding:14px;background:#0a0a0a;color:#fff;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer}
.btn-sec{background:#fff;color:#000;border:2px solid #000}.btn-red{background:#ef4444}
.tabs{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--bd);overflow-x:auto;background:#fafafa;position:sticky;top:57px;z-index:10}
.tab{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:1px solid var(--bd);background:#fff}
.tab.active{background:#000;color:#fff}
.content{padding:14px;flex:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#f9fafb;border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;position:relative}
.card img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:#f3f4f6}
.card h3{font-size:14px}.card p{font-size:12px;color:#6b7280;line-height:1.4}
.del{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;border:none;border-radius:8px;padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer}
.edit{position:absolute;top:10px;right:56px;background:#000;color:#fff;border:none;border-radius:8px;padding:5px 9px;font-size:10px;cursor:pointer}
.low{border-left:4px solid #ef4444}.hidden{display:none}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:11px;color:#9ca3af;text-align:center;margin:12px 0;line-height:1.5}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.section-title{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#6b7280;margin:18px 0 10px}
</style></head><body><div class="app">
<div class="header hidden" id="header"><div class="logo" id="shopNameLogo">V16 SHOP</div><div style="display:flex;gap:10px;align-items:center"><span id="roleBadge" class="badge"></span><span class="logout" onclick="logout()">Sohoka</span></div></div>
<div id="loginPage" class="login"><h1 id="loginTitle">V16 SHOP</h1><p class="sub">V3.2 FINAL - Staff Yemerewe Gucuruza</p>
<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">Injira</button>
<div class="small">Admin: admin / 1234 (Byose + Gusiba)<br>Staff: staff / 1234 (Gucuruza + Emeza, NTIBASIBA)<br>Client: 211 / 211 (Shop gusa)</div></div>
<div id="mainApp" class="hidden" style="flex:1;display:flex;flex-direction:column"><div class="tabs" id="tabs"></div><div class="content" id="content"></div></div>
</div>
<script>
const K_USERS='v16_v3_users', K_PRODS='v16_v3_prods', K_ORDERS='v16_v3_orders', K_CFG='v16_v3_cfg', K_SESS='v16_v3_sess';
let me=null, curTab='dashboard';
function defUsers(){return [{u:'admin',p:'1234',role:'admin',name:'Admin Mukuru'},{u:'staff',p:'1234',role:'staff',name:'Staff'},{u:'211',p:'211',role:'client',name:'Client 211'}]}
function getUsers(){return JSON.parse(localStorage.getItem(K_USERS)||JSON.stringify(defUsers()))}
function saveUsers(a){localStorage.setItem(K_USERS,JSON.stringify(a))}
function getProds(){return JSON.parse(localStorage.getItem(K_PRODS)||'[]')}
function saveProds(a){localStorage.setItem(K_PRODS,JSON.stringify(a))}
function getOrders(){return JSON.parse(localStorage.getItem(K_ORDERS)||'[]')}
function saveOrders(a){localStorage.setItem(K_ORDERS,JSON.stringify(a))}
function getCfg(){return JSON.parse(localStorage.getItem(K_CFG)||'{"shopName":"V16 SHOP","wa":"250788000000"}')}
function saveCfg(c){localStorage.setItem(K_CFG,JSON.stringify(c))}
function doLogin(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value.trim();const f=getUsers().find(x=>x.u===u&&x.p===p);if(!f){alert('Nabi!');return}me=f;localStorage.setItem(K_SESS,JSON.stringify(me));render();}
function logout(){localStorage.removeItem(K_SESS);me=null;document.getElementById('loginPage').classList.remove('hidden');document.getElementById('header').classList.add('hidden');document.getElementById('mainApp').classList.add('hidden');}
function render(){const cfg=getCfg();document.getElementById('shopNameLogo').textContent=cfg.shopName;document.getElementById('loginPage').classList.add('hidden');document.getElementById('header').classList.remove('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('roleBadge').textContent=me.role.toUpperCase();document.getElementById('roleBadge').className='badge b-'+me.role;let tabs=[];if(me.role==='admin'){tabs=[{id:'dashboard',l:'📊 Dashboard'},{id:'products',l:'📦 Stock'},{id:'orders',l:'🧾 Orders'},{id:'users',l:'👥 Users'},{id:'add',l:'➕ Ongeramo'},{id:'settings',l:'⚙️ Settings'}];curTab='dashboard'}else if(me.role==='staff'){tabs=[{id:'shop',l:'🛍️ Shop'},{id:'orders',l:'🧾 Orders'}];curTab='shop'}else{tabs=[{id:'shop',l:'🛍️ Shop'},{id:'myorders',l:'📦 My Orders'}];curTab='shop'}document.getElementById('tabs').innerHTML=tabs.map(t=>`<div class="tab ${curTab===t.id?'active':''}" onclick="goTab('${t.id}')">${t.l}</div>`).join('');goTab(curTab);}
function goTab(id){curTab=id;document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));const el=document.querySelector(`.tab[onclick="goTab('${id}')"]`);if(el)el.classList.add('active');const c=document.getElementById('content');if(id==='dashboard')drawDash(c);else if(id==='products')drawProds(c);else if(id==='orders')drawOrders(c);else if(id==='users')drawUsers(c);else if(id==='add')drawAdd(c);else if(id==='settings')drawSettings(c);else if(id==='shop')drawShop(c);else if(id==='myorders')drawMyOrders(c);}
function drawDash(c){const prods=getProds(),orders=getOrders(),cfg=getCfg();const total=prods.reduce((s,p)=>s+Number(p.sell||0)*Number(p.qty||0),0);const low=prods.filter(p=>Number(p.qty)<=3);c.innerHTML=`<div class="stat-grid"><div class="stat"><span>Ibicuruzwa</span><b>${prods.length}</b></div><div class="stat"><span>Orders</span><b>${orders.length}</b></div><div class="stat"><span>Agaciro Total</span><b>${total.toLocaleString()} RWF</b></div><div class="stat"><span>Low Stock</span><b>${low.length}</b></div></div>${low.length?`<div class="card low"><h3>⚠️ Bike</h3><p>${low.map(p=>`${p.name} (${p.qty})`).join(', ')}</p></div>`:''}<div class="card"><h3>🏪 ${cfg.shopName}</h3><p>Admin: ${me.name}<br>Orders: ${orders.length}<br><br>✅ Staff yemerewe gucuruza<br>✅ Staff NTIYEMEREWE gusiba<br>✅ Admin niwe usiba</p></div>`}
function drawProds(c){const prods=getProds();if(!prods.length){c.innerHTML='<p class="small">Nta gicuruzwa</p>';return}c.innerHTML=prods.map(p=>`<div class="card ${Number(p.qty)<=3?'low':''}">${p.img?`<img src="${p.img}" onerror="this.style.display='none'">`:''}<h3>${p.name}</h3><p>Igura: ${p.buy||0} | <b>${p.sell} RWF</b><br>Stock: <b>${p.qty}</b><br>${p.desc||''}</p>${me.role==='admin'?`<button class="edit" onclick="editProd(${p.id})">Edit</button><button class="del" onclick="delProd(${p.id})">Siba</button>`:''}</div>`).join('')}
function drawAdd(c,edit=null){c.innerHTML=`<div class="card" style="border:2px solid #000"><h3>${edit?'✏️ Hindura':'➕ Ongeramo - Admin Only'}</h3><br><input id="pn" placeholder="Izina *" value="${edit?edit.name:''}"><div class="row2"><input id="pb" type="number" placeholder="Igura" value="${edit?edit.buy:''}"><input id="ps" type="number" placeholder="Igurisha *" value="${edit?edit.sell:''}"></div><div class="row2"><input id="pq" type="number" placeholder="Stock *" value="${edit?edit.qty:''}"><input id="pi2" placeholder="Image URL" value="${edit?edit.img:''}"></div><textarea id="pd" placeholder="Ibisobanuro">${edit?edit.desc||'':''}</textarea><button class="btn" onclick="${edit?`updProd(${edit.id})`:'newProd()'}">${edit?'Bika':'Bika'}</button></div>`}
function newProd(){const name=document.getElementById('pn').value.trim(),buy=document.getElementById('pb').value.trim(),sell=document.getElementById('ps').value.trim(),qty=document.getElementById('pq').value.trim(),img=document.getElementById('pi2').value.trim(),desc=document.getElementById('pd').value.trim();if(!name||!sell||!qty){alert('Izina, Igurisha, Stock!');return}const a=getProds();a.unshift({id:Date.now(),name,buy,sell,qty,img,desc});saveProds(a);alert('✅ Byabitswe!');goTab('products')}
function delProd(id){if(!confirm('Gusiba?'))return;saveProds(getProds().filter(p=>p.id!==id));drawProds(document.getElementById('content'))}
function editProd(id){const p=getProds().find(x=>x.id===id);goTab('add');setTimeout(()=>drawAdd(document.getElementById('content'),p),60)}
function updProd(id){const name=document.getElementById('pn').value.trim(),buy=document.getElementById('pb').value.trim(),sell=document.getElementById('ps').value.trim(),qty=document.getElementById('pq').value.trim(),img=document.getElementById('pi2').value.trim(),desc=document.getElementById('pd').value.trim();let a=getProds(),i=a.findIndex(x=>x.id===id);if(i>-1){a[i]={...a[i],name,buy,sell,qty,img,desc};saveProds(a);goTab('products')}}
function drawOrders(c){
  const orders=getOrders();
  if(!orders.length){c.innerHTML='<p class="small">Nta order. Staff nibacuruza zizaza hano.</p>';return}
  c.innerHTML=`<div class="section-title">Orders (${orders.length}) - Staff yemerewe gucuruza</div>`+orders.map(o=>`<div class="card"><h3>${o.product} - ${o.price} RWF</h3><p>Yacurujwe na: <b>${o.by}</b><br>Status: <b style="color:${o.status==='Pending'?'#f59e0b':o.status==='Approved'?'#3b82f6':'#10b981'}">${o.status}</b><br>${o.date}</p><div style="display:flex;gap:6px;margin-top:8px">
  ${me.role==='admin'?`<button style="flex:1;padding:8px;border-radius:10px;border:none;background:#000;color:#fff;font-weight:800" onclick="updOrder(${o.id},'Approved')">Emeza</button><button style="flex:1;padding:8px;border-radius:10px;border:none;background:#e5e7eb;font-weight:800" onclick="updOrder(${o.id},'Delivered')">Delivered</button><button style="flex:1;padding:8px;border-radius:10px;border:none;background:#fee2e2;color:#b91c1c;font-weight:800" onclick="delOrder(${o.id})">Siba - Admin</button>`:
  me.role==='staff'?`<button style="flex:1;padding:8px;border-radius:10px;border:none;background:#000;color:#fff;font-weight:800" onclick="updOrder(${o.id},'Approved')">Emeza</button><button style="flex:1;padding:8px;border-radius:10px;border:none;background:#e5e7eb;font-weight:800" onclick="updOrder(${o.id},'Delivered')">Delivered</button><span style="flex:1;font-size:10px;text-align:center;padding:8px;background:#f3f4f6;border-radius:10px;color:#888">NTUSHOBORA GUSIBA</span>`:
  `<span style="font-size:11px;color:#888">Admin niwe usiba</span>`}
  </div></div>`).join('')
}
function drawMyOrders(c){const orders=getOrders().filter(o=>o.by===me.u);if(!orders.length){c.innerHTML='<p class="small">Nta order ufite</p>';return}c.innerHTML=orders.map(o=>`<div class="card"><h3>${o.product}</h3><p>${o.price} RWF - ${o.status}<br>${o.date}</p></div>`).join('')}
function updOrder(id,s){let a=getOrders(),i=a.findIndex(o=>o.id===id);if(i>-1){a[i].status=s;saveOrders(a);drawOrders(document.getElementById('content'))}}
function delOrder(id){if(me.role!=='admin'){alert('⛔ Staff ntishobora gusiba! Admin gusa.');return}if(!confirm('Gusiba? Admin only'))return;saveOrders(getOrders().filter(o=>o.id!==id));drawOrders(document.getElementById('content'))}
function drawUsers(c){if(me.role!=='admin'){c.innerHTML='<p class="small">Admin only</p>';return}const users=getUsers();c.innerHTML=users.map(u=>`<div class="card"><h3>${u.name} - ${u.u}</h3><p>Role: <b>${u.role}</b> | Pass: ${u.p}</p>${u.u!=='admin'?`<button class="del" onclick="remUser('${u.u}')">Siba</button><button class="edit" onclick="editUserPass('${u.u}')">Password</button>`:''}</div>`).join('')+`<div class="card" style="margin-top:14px;border:2px solid #000"><h3>➕ Ongeramo User</h3><input id="uu" placeholder="Username"><input id="up" placeholder="Password"><select id="ur"><option value="client">Client - Shop gusa</option><option value="staff">Staff - Shop + Orders + Gucuruza</option><option value="admin">Admin - Byose</option></select><button class="btn" onclick="addUser()">Bika</button></div>`}
function addUser(){const u=document.getElementById('uu').value.trim(),p=document.getElementById('up').value.trim(),r=document.getElementById('ur').value;if(!u||!p)return;let a=getUsers();if(a.find(x=>x.u===u)){alert('Urisanzweho');return}a.push({u,p,role:r,name:u});saveUsers(a);drawUsers(document.getElementById('content'))}
function remUser(u){if(u==='admin')return;if(!confirm('Gusiba '+u+'?'))return;saveUsers(getUsers().filter(x=>x.u!==u));drawUsers(document.getElementById('content'))}
function editUserPass(u){const np=prompt('Password nshya ya '+u+':');if(!np)return;let a=getUsers(),i=a.findIndex(x=>x.u===u);if(i>-1){a[i].p=np;saveUsers(a);alert('✅ Password yahindutse!');drawUsers(document.getElementById('content'))}}
function drawSettings(c){if(me.role!=='admin'){c.innerHTML='<p class="small">Admin only</p>';return}const cfg=getCfg(),admin=getUsers().find(x=>x.u==='admin');c.innerHTML=`<div class="section-title">⚙️ Settings - Admin Mukuru</div><div class="card" style="border:2px solid #000"><h3>🔐 Hindura Password ya Admin Mukuru</h3><p style="margin:8px 0">Username: admin<br>Password ya kera: <b>${admin.p}</b></p><input id="oldp" type="password" placeholder="Password ya kera"><input id="newp" type="password" placeholder="Password nshya *"><input id="newp2" type="password" placeholder="Emeza nshya"><button class="btn" onclick="changeAdminPass()">Hindura Password</button></div><div class="card"><h3>🏪 Izina rya Shop</h3><input id="shopNameIn" value="${cfg.shopName}"><button class="btn btn-sec" onclick="saveShopName()">Bika Izina</button></div><div class="card"><h3>📱 WhatsApp Number</h3><input id="waIn" value="${cfg.wa}" placeholder="250788000000"><button class="btn btn-sec" onclick="saveWa()">Bika WhatsApp</button></div><div class="card"><h3>🗑️ Siba Data</h3><p style="font-size:11px;margin-bottom:8px">Siba ibicuruzwa na orders (Users zisigara)</p><button class="btn btn-red" onclick="resetData()">Siba Byose</button></div>`}
function changeAdminPass(){const oldp=document.getElementById('oldp').value.trim(),np=document.getElementById('newp').value.trim(),np2=document.getElementById('newp2').value.trim();const admin=getUsers().find(x=>x.u==='admin');if(oldp!==admin.p){alert('Password ya kera nabi!');return}if(!np||np.length<4){alert('Min 4 chars');return}if(np!==np2){alert('Ntizihura!');return}let users=getUsers(),i=users.findIndex(x=>x.u==='admin');users[i].p=np;saveUsers(users);alert('✅ Password yahindutse! Nshya: '+np+'\nKoresha nshya ubutaha.');drawSettings(document.getElementById('content'))}
function saveShopName(){const n=document.getElementById('shopNameIn').value.trim();if(!n)return;let cfg=getCfg();cfg.shopName=n;saveCfg(cfg);document.getElementById('shopNameLogo').textContent=n;alert('✅ Izina: '+n)}
function saveWa(){const w=document.getElementById('waIn').value.trim();let cfg=getCfg();cfg.wa=w;saveCfg(cfg);alert('✅ WhatsApp: '+w)}
function resetData(){if(!confirm('Siba ibicuruzwa na orders?'))return;localStorage.removeItem(K_PRODS);localStorage.removeItem(K_ORDERS);alert('Byasibwe!');goTab('dashboard')}
function drawShop(c){
  const prods=getProds();
  if(!prods.length){c.innerHTML='<p class="small">Nta gicuruzwa. Admin ongeramo muri ➕ Ongeramo</p>';return}
  c.innerHTML=`<div class="shop-grid">`+prods.map(p=>`<div class="card" onclick="buyProd(${p.id})">${p.img?`<img src="${p.img}" onerror="this.style.display='none'">`:''}<h3>${p.name}</h3><p>${p.desc||''}</p><p style="margin-top:6px"><b>${p.sell} RWF</b> ${Number(p.qty)<=3?'<span style="color:red;font-size:10px"> Bike!</span>':''}<br><span style="font-size:10px">Stock: ${p.qty}</span></p><button class="btn" style="margin-top:8px;padding:10px;font-size:12px">${me.role==='staff'?'Gucuruza':me.role==='client'?'Gura':'Reba'}</button></div>`).join('')+`</div><div class="small">${prods.length} products • Staff yemerewe gucuruza, ntiyemerewe gusiba</div>`
}
function buyProd(id){
  const p=getProds().find(x=>x.id===id);
  if(!p)return;
  if(me.role==='admin'){alert('ℹ️ Admin ureba gusa. Staff na Client ni bo bacuruza.');return}
  const orders=getOrders();
  orders.unshift({id:Date.now(),product:p.name,price:p.sell,by:me.u,status:'Pending',date:new Date().toLocaleString()});
  saveOrders(orders);
  const cfg=getCfg();
  const wa=`https://wa.me/${cfg.wa}?text=${encodeURIComponent('Ndashaka '+p.name+' - '+p.sell+' RWF | Staff/Client: '+me.u)}`;
  if(confirm(`✅ Order ya ${p.name} yakiriwe!\nYacurujwe na: ${me.u}\nAdmin ayibona muri Orders.\n\nWohereze kuri WhatsApp?`)){window.open(wa,'_blank')}
}
window.onload=()=>{const s=localStorage.getItem(K_SESS);if(s){me=JSON.parse(s);const users=getUsers();const fresh=users.find(x=>x.u===me.u);if(fresh)me=fresh;render()}if(!localStorage.getItem(K_PRODS)){saveProds([{id:1,name:'V16 T-Shirt Original',buy:'15000',sell:'25000',qty:'12',img:'',desc:'V16 Collection'},{id:2,name:'Inkweto Sneakers',buy:'20000',sell:'35000',qty:'2',img:'',desc:'Size 42 - Low Stock'},{id:3,name:'Jean Trouser',buy:'18000',sell:'30000',qty:'8',img:'',desc:'Quality Jean'}])}}
</script></body></html>
